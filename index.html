<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nkiza Center for Research</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0F49BD", // Requested Primary Blue
            secondary: "#8B1E1E", // Deep Red from hero background in screenshot
            "background-light": "#F9FAFB",
            "background-dark": "#0B1120",
            "surface-light": "#FFFFFF",
            "surface-dark": "#1F2937",
            "text-light": "#111827",
            "text-dark": "#F3F4F6",
            "muted-light": "#6B7280",
            "muted-dark": "#9CA3AF",
            "navy-deep": "#0a1a3b",
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
            sans: ["Inter", "sans-serif"],
            serif: ["Inter", "serif"],
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            'lg': '0.5rem',
            'xl': '1rem',
            '2xl': '1.5rem',
          },
          backgroundImage: {
            'hero-pattern': "url('https://images.unsplash.com/photo-1555679427-1f6dfcce943b?q=80&w=2073&auto=format&fit=crop')",
          }
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-background-light text-slate-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
